name: Publish packages

# Pushes a CLI release to Homebrew and winget. CI calls it after each CLI release; run it by
# hand (Actions > Publish packages) to redo a version or to publish one for the first time.
# It uses nova-ai-packaging.tar.gz from that GitHub release. Setup: docs/PACKAGING.md.
on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: "CLI version, as in the release tag (for example 1.3.0)"
        type: string
        required: true

permissions:
  contents: read

env:
  TAG: "@datalabrotterdam/nova-ai-cli@${{ inputs.version }}"

jobs:
  homebrew:
    name: Homebrew tap
    runs-on: ubuntu-latest
    env:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check the secret
        id: secret
        run: |
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "::notice::HOMEBREW_TAP_TOKEN is not set, so the Homebrew tap is not updated."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Download the manifests
        if: steps.secret.outputs.ready == 'true'
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern nova-ai-packaging.tar.gz
          tar -xzf nova-ai-packaging.tar.gz
      - name: Checkout the tap
        if: steps.secret.outputs.ready == 'true'
        uses: actions/checkout@v4
        with:
          repository: Datalab-Rotterdam/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - name: Update the cask
        if: steps.secret.outputs.ready == 'true'
        working-directory: tap
        run: |
          mkdir -p Casks
          cp ../packaging/homebrew/*.rb Casks/
          git config user.name "nova-ai release bot"
          git config user.email "actions@users.noreply.github.com"
          git add Casks
          if git diff --cached --quiet; then
            echo "The tap already has ${{ inputs.version }}."
          else
            git commit -m "nova-ai ${{ inputs.version }}"
            git push
          fi

  winget:
    name: winget-pkgs pull request
    # winget has no prerelease channel, so alpha versions are skipped.
    if: ${{ !contains(inputs.version, '-') }}
    runs-on: ubuntu-latest
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
      GH_TOKEN: ${{ secrets.WINGET_TOKEN }}
      RELEASE_TOKEN: ${{ github.token }}
      FORK: Datalab-Rotterdam/winget-pkgs
    steps:
      - name: Check the secret
        id: secret
        run: |
          if [ -z "$WINGET_TOKEN" ]; then
            echo "::notice::WINGET_TOKEN is not set, so no winget-pkgs pull request is opened."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Download the manifests
        if: steps.secret.outputs.ready == 'true'
        run: |
          GH_TOKEN="$RELEASE_TOKEN" gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern nova-ai-packaging.tar.gz
          tar -xzf nova-ai-packaging.tar.gz
      - name: Bring the fork up to date
        if: steps.secret.outputs.ready == 'true'
        run: gh repo sync "$FORK" --branch master
      - name: Checkout the fork
        if: steps.secret.outputs.ready == 'true'
        run: |
          # The repository is huge: take only the folders needed.
          git clone --depth 1 --filter=blob:none --sparse --branch master \
            "https://x-access-token:${WINGET_TOKEN}@github.com/${FORK}.git" winget-pkgs
          git -C winget-pkgs sparse-checkout set manifests/d/DatalabRotterdam
      - name: Open the pull request
        if: steps.secret.outputs.ready == 'true'
        working-directory: winget-pkgs
        run: |
          version="${{ inputs.version }}"
          dir="manifests/d/DatalabRotterdam/NovaAI/$version"
          if [ -d manifests/d/DatalabRotterdam/NovaAI ]; then
            title="New version: DatalabRotterdam.NovaAI version $version"
          else
            title="New package: DatalabRotterdam.NovaAI version $version"
          fi
          branch="nova-ai-$version"
          git checkout -b "$branch"
          mkdir -p "$dir"
          cp "../packaging/winget/$version/"*.yaml "$dir/"
          git config user.name "nova-ai release bot"
          git config user.email "actions@users.noreply.github.com"
          git add manifests
          git commit -m "$title"
          git push --force origin "$branch"
          gh pr create --repo microsoft/winget-pkgs --base master \
            --head "${FORK%%/*}:$branch" --title "$title" \
            --body "Published from https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG//@/%40}"
