name: CI

on:
  pull_request:
  # Other branches are tested through their pull request; running on both
  # the push and the PR doubled every run.
  push:
    branches:
      - main
      - alpha
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      # npm 11 skips dependency install scripts, and node-pty has no
      # prebuilt binary for Linux; its macOS helper loses the execute bit.
      - name: Prepare node-pty (Linux)
        if: runner.os == 'Linux'
        working-directory: node_modules/node-pty
        run: npx --yes node-gyp rebuild
      - name: Prepare node-pty (macOS)
        if: runner.os == 'macOS'
        run: chmod +x node_modules/node-pty/prebuilds/*/spawn-helper
      - name: Type check
        run: npx tsc -p tsconfig.json --noEmit
      - name: Unit and ACP conformance tests
        run: npm run test:unit
      # The real-terminal scenario; not yet verified on Windows (ConPTY).
      - name: PTY scenario
        if: runner.os != 'Windows'
        run: npm run test:pty
      - name: Build the package
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        run: npm run build

  release:
    name: Release
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/alpha')
    needs:
      - test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      NPM_CONFIG_PROVENANCE: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org/"
      - name: Install dependencies
        run: npm install
      - name: Restore tracked files
        run: git restore .
      - name: Update npm for trusted publishing support
        run: npm install -g npm@latest
      - name: Build the package
        run: npm run build
      - name: Run semantic-release
        run: npx semantic-release
